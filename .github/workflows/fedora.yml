name: Build AyuGram Desktop (Fedora)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1,3,5"

permissions:
  contents: write

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      continue_build: ${{ steps.check.outputs.continue_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Check upstream commit
        id: check
        run: |
          set -euo pipefail
          HASH="$(git ls-remote https://github.com/AyuGram/AyuGramDesktop.git HEAD | cut -f1)"
          if [ -z "$HASH" ]; then
            echo "failed to fetch latest commit"
            exit 1
          fi
          TRACKED="$(cat commit)"
          echo "commit=$HASH" >> "$GITHUB_OUTPUT"
          if [ "$HASH" = "$TRACKED" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "continue_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "continue_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Track upstream commit
        if: ${{ steps.check.outputs.continue_build == 'true' && github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          echo "${{ steps.check.outputs.commit }}" > commit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commit
          git commit -m "upstream updated to ${{ steps.check.outputs.commit }}"
          git push

  build:
    needs: version
    if: ${{ needs.version.outputs.continue_build != 'false' }}
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap to 8 GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Build package
        run: |
          curl -fsSL https://get.docker.com -o install-docker.sh
          sudo sh install-docker.sh
          sudo systemctl start docker
          mkdir -p out
          docker run --rm -v $(pwd):/share -w /share fedora:44 bash -euxc "
            dnf -y install curl git dnf-plugins-core redhat-rpm-config rpm-build
            dnf -y install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm

            mkdir -p /build/pkg
            git clone https://github.com/itsaschoolbus/ayugram-desktop-git-rpm.git /build/pkg
            cd /build/pkg
            bash create-ayugram-tarball-full.sh

            dnf -y builddep --spec /build/pkg/ayugram-desktop-git.spec
            dnf -y clean all

            rpmbuild -ba --define '_topdir /build/rpmbuild' --define '_sourcedir /build/pkg' /build/pkg/ayugram-desktop-git.spec

            mkdir -p /share/out
            find /build/rpmbuild -name '*.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp -v {} /share/out/ \;
            rpm -qp --qf '%{VERSION}-%{RELEASE}' /share/out/ayugram-desktop-git-*.x86_64.rpm > /share/out/version
          "

      - name: Read built version
        id: pkg
        run: |
          VERSION="$(cat out/version)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload to releases
        uses: softprops/action-gh-release@master
        with:
          files: out/*.rpm
          tag_name: fc44
          name: ayugram-desktop-git ${{ steps.pkg.outputs.version }}
          body: "upstream commit: ${{ needs.version.outputs.commit }}"
          overwrite_files: true
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
